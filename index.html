<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 公開ページとして置いても検索結果に載らないようにする（QRを知っている人だけが開く想定） -->
  <meta name="robots" content="noindex, nofollow">
  <!-- iPhoneで「ホーム画面に追加」したときにアプリのように全画面で開く -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Number Touch">
  <title>Number Touch - 練習用</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #0f3460;
      --blue: #4fc3f7;
      --green: #66bb6a;
      --red: #ef5350;
      --yellow: #ffa726;
      --text: #e8eaf6;
      --text2: #9fa8da;
      --cell-bg: #1e2a45;
      --cell-border: #2a3f6f;
      --cell-hover: #253555;
      --cell-num: #4a9eca;
      --cell-alpha: #e67e3a;
      --cell-hit: #1b5e20;
      --cell-hit-border: #66bb6a;
      --cell-miss: #7f1010;
      --cell-miss-border: #ef5350;
      --cell-next: #1a3a5c;
      --cell-next-border: #4fc3f7;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      user-select: none;
      touch-action: manipulation; /* ダブルタップでの拡大を防ぐ */
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--blue), #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text2);
      margin-bottom: 18px;
      letter-spacing: 0.08em;
    }

    /* Mode selector */
    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-btn {
      padding: 7px 20px;
      border-radius: 20px;
      border: 2px solid var(--cell-border);
      background: var(--surface);
      color: var(--text2);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn:hover { border-color: var(--blue); color: var(--blue); }
    .mode-btn.active {
      background: var(--accent);
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      background: var(--surface);
      border: 1px solid var(--cell-border);
      border-radius: 12px;
      padding: 10px 24px;
      align-items: center;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #timer-val { color: var(--blue); }
    #next-val { color: var(--yellow); font-size: 1.5rem; }
    #errors-val { color: var(--red); }
    #best-val { color: var(--green); font-size: 1rem; }

    .divider { width: 1px; height: 40px; background: var(--cell-border); }

    /* Grid */
    .grid-wrapper {
      position: relative;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .cell {
      width: 68px;
      height: 68px;
      border-radius: 10px;
      border: 2px solid var(--cell-border);
      background: var(--cell-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .cell.num { color: var(--cell-num); }
    .cell.alpha { color: var(--cell-alpha); }

    /* スマホではタップ後に :hover が残って色が紛らわしくなるため、マウス操作時のみ有効にする */
    @media (hover: hover) {
      .cell:hover:not(.done):not(.disabled) {
        background: var(--cell-hover);
        border-color: var(--blue);
        transform: scale(1.05);
      }
    }

    .cell.next-target {
      border-color: var(--cell-next-border);
      background: var(--cell-next);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(79, 195, 247, 0); }
    }

    /* 正解：タップしたセルが緑に変わり、そのまま残る（薄くしすぎず、押したことが分かる） */
    .cell.hit {
      background: #2e7d32;
      border-color: #a5d6a7;
      color: #ffffff;
      animation: hitAnim 0.3s ease-out;
    }

    @keyframes hitAnim {
      0% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* 間違い：押したセルが赤くなって揺れる（はっきり分かる色と時間） */
    .cell.miss {
      background: #c62828;
      border-color: #ff8a80;
      color: #ffffff;
      animation: shake 0.35s ease-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .cell.done {
      opacity: 0.85;
      cursor: default;
    }

    .cell.disabled { cursor: default; }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .btn {
      padding: 10px 28px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0f3460, #1565c0);
      color: #fff;
      border: 1px solid var(--blue);
    }
    .btn-primary:hover { background: linear-gradient(135deg, #1565c0, #1976d2); transform: translateY(-1px); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text2);
      border: 1px solid var(--cell-border);
    }
    .btn-secondary:hover { border-color: var(--text2); color: var(--text); }

    /* History */
    .history-section {
      width: 100%;
      max-width: 380px;
    }

    .history-title {
      font-size: 0.75rem;
      color: var(--text2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-align: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--cell-border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.82rem;
    }

    .history-item .h-mode { color: var(--text2); }
    .history-item .h-time { color: var(--blue); font-weight: 700; font-variant-numeric: tabular-nums; }
    .history-item .h-err { color: var(--red); font-size: 0.75rem; }
    .history-item .h-rank { color: var(--yellow); font-size: 0.85rem; }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .result-card {
      background: var(--surface2);
      border: 1px solid var(--blue);
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      transform: scale(0.85);
      transition: transform 0.3s;
      min-width: 280px;
    }

    .overlay.visible .result-card { transform: scale(1); }

    .result-card h2 {
      font-size: 1.5rem;
      color: var(--blue);
      margin-bottom: 6px;
    }

    .result-time {
      font-size: 3.5rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
      margin: 12px 0 4px;
    }

    .result-time span { font-size: 1.2rem; color: var(--text2); }

    .result-details {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin: 16px 0 20px;
    }

    .result-detail {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .result-detail .rd-label { font-size: 0.7rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.1em; }
    .result-detail .rd-val { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }

    .result-best {
      font-size: 0.85rem;
      color: var(--green);
      margin-bottom: 16px;
    }

    @media (max-width: 420px) {
      .cell { width: 58px; height: 58px; font-size: 1.1rem; }
      .grid { gap: 4px; }
      .stats-bar { gap: 12px; padding: 8px 14px; }
    }
  </style>
</head>
<body>

<h1>Number Touch</h1>
<p class="subtitle">注意機能トレーニング</p>

<div class="mode-bar">
  <button class="mode-btn active" onclick="setMode('A')">モード A<br><small style="font-weight:400;font-size:0.7em">数字のみ</small></button>
  <button class="mode-btn" onclick="setMode('B')">モード B<br><small style="font-weight:400;font-size:0.7em">数字＋ひらがな</small></button>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-label">タイム</div>
    <div class="stat-value" id="timer-val">0.00</div>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <div class="stat-label">次のターゲット</div>
    <div class="stat-value" id="next-val">—</div>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <div class="stat-label">ミス</div>
    <div class="stat-value" id="errors-val">0</div>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <div class="stat-label">ベスト</div>
    <div class="stat-value" id="best-val">—</div>
  </div>
</div>

<div class="grid-wrapper">
  <div class="grid" id="grid"></div>
</div>

<div class="controls">
  <button class="btn btn-primary" id="start-btn" onclick="startGame()">スタート</button>
  <button class="btn btn-secondary" onclick="resetGame()">リセット</button>
</div>

<div class="history-section">
  <div class="history-title">最近の記録</div>
  <div class="history-list" id="history-list"></div>
</div>

<!-- Result overlay -->
<div class="overlay" id="overlay">
  <div class="result-card">
    <h2>クリア！</h2>
    <div class="result-time" id="result-time">0<span> 秒</span></div>
    <div class="result-details">
      <div class="result-detail">
        <div class="rd-label">ミス</div>
        <div class="rd-val" id="result-errors" style="color:var(--red)">0</div>
      </div>
      <div class="result-detail">
        <div class="rd-label">モード</div>
        <div class="rd-val" id="result-mode" style="color:var(--blue)">A</div>
      </div>
    </div>
    <div class="result-best" id="result-best"></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-primary" onclick="closeOverlay(); startGame()">もう一度</button>
      <button class="btn btn-secondary" onclick="closeOverlay()">閉じる</button>
    </div>
  </div>
</div>

<script>
  // ---- State ----
  let mode = 'A';
  let sequence = [];        // ordered answer sequence
  let positions = [];       // shuffled display items [{value, type}]
  let currentIdx = 0;
  let errors = 0;
  let timerInterval = null;
  let startTime = null;
  let elapsed = 0;
  let running = false;
  let finished = false;

  // history in localStorage
  const STORAGE_KEY = 'numbertouch_history';

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveHistory(entry) {
    const h = getHistory();
    h.unshift(entry);
    if (h.length > 10) h.splice(10);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
  }

  function getBest(m) {
    const h = getHistory().filter(e => e.mode === m);
    if (!h.length) return null;
    return Math.min(...h.map(e => e.time));
  }

  // ---- Mode ----
  function setMode(m) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && m === 'A') || (i === 1 && m === 'B'));
    });
    resetGame();
  }

  // ---- Sequence generation ----
  function buildSequence() {
    if (mode === 'A') {
      // Numbers 1–25
      sequence = Array.from({length: 25}, (_, i) => ({ value: String(i + 1), type: 'num' }));
    } else {
      // Mode B: 1,あ,2,い,...,12,し,13  (25 items。文字は五十音順のひらがな)
      const KANA = ['あ', 'い', 'う', 'え', 'お', 'か', 'き', 'く', 'け', 'こ', 'さ', 'し'];
      sequence = [];
      for (let i = 1; i <= 13; i++) {
        sequence.push({ value: String(i), type: 'num' });
        if (i <= 12) sequence.push({ value: KANA[i - 1], type: 'alpha' });
      }
    }
    // positions = shuffled copy
    positions = [...sequence].sort(() => Math.random() - 0.5);
  }

  // ---- Render ----
  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    positions.forEach(item => {
      const cell = document.createElement('div');
      cell.className = `cell ${item.type}`;
      cell.textContent = item.value;
      cell.dataset.value = item.value;
      cell.classList.add('disabled');

      cell.addEventListener('click', () => handleClick(item.value));
      grid.appendChild(cell);
    });
  }

  function getCellByValue(val) {
    return document.querySelector(`.cell[data-value="${CSS.escape(val)}"]`);
  }

  function highlightNext() {
    // Remove existing highlight
    document.querySelectorAll('.cell.next-target').forEach(c => c.classList.remove('next-target'));
    if (currentIdx < sequence.length) {
      const target = getCellByValue(sequence[currentIdx].value);
      if (target) target.classList.add('next-target');
    }
  }

  function updateNextDisplay() {
    const el = document.getElementById('next-val');
    if (!running || finished) { el.textContent = '—'; return; }
    if (currentIdx < sequence.length) {
      el.textContent = sequence[currentIdx].value;
      el.style.color = sequence[currentIdx].type === 'alpha' ? 'var(--cell-alpha)' : 'var(--yellow)';
    }
  }

  function updateBestDisplay() {
    const best = getBest(mode);
    document.getElementById('best-val').textContent = best ? formatTime(best) : '—';
  }

  // ---- Timer ----
  function formatTime(ms) {
    return (ms / 1000).toFixed(2);
  }

  function tickTimer() {
    elapsed = performance.now() - startTime;
    document.getElementById('timer-val').textContent = formatTime(elapsed);
  }

  // ---- Click handler ----
  function handleClick(val) {
    if (!running || finished) return;
    const expected = sequence[currentIdx].value;
    const cell = getCellByValue(val);

    if (val === expected) {
      // Correct
      cell.classList.remove('next-target');
      cell.classList.add('hit', 'done');
      cell.style.pointerEvents = 'none';
      currentIdx++;

      if (currentIdx >= sequence.length) {
        endGame();
      } else {
        highlightNext();
        updateNextDisplay();
      }
    } else {
      // Wrong
      errors++;
      document.getElementById('errors-val').textContent = errors;
      cell.classList.add('miss');
      if (navigator.vibrate) navigator.vibrate(80); // 対応端末のみ（iPhoneは非対応）
      setTimeout(() => cell.classList.remove('miss'), 700);
    }
  }

  // ---- Game lifecycle ----
  function startGame() {
    if (running) resetGame();
    buildSequence();
    renderGrid();

    // Enable cells
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('disabled'));

    currentIdx = 0;
    errors = 0;
    elapsed = 0;
    finished = false;

    document.getElementById('errors-val').textContent = '0';
    document.getElementById('timer-val').textContent = '0.00';
    document.getElementById('start-btn').textContent = '進行中…';
    document.getElementById('start-btn').disabled = true;

    updateBestDisplay();
    highlightNext();
    updateNextDisplay();

    running = true;
    startTime = performance.now();
    timerInterval = setInterval(tickTimer, 50);
  }

  function endGame() {
    clearInterval(timerInterval);
    running = false;
    finished = true;

    const finalTime = elapsed;
    const best = getBest(mode);
    const isNewBest = !best || finalTime < best;

    saveHistory({ mode, time: finalTime, errors, date: Date.now() });

    // Show overlay
    const sec = (finalTime / 1000).toFixed(2);
    const [whole, frac] = sec.split('.');
    document.getElementById('result-time').innerHTML = `${whole}<span>.${frac} 秒</span>`;
    document.getElementById('result-errors').textContent = errors;
    document.getElementById('result-mode').textContent = `モード ${mode}`;
    document.getElementById('result-best').textContent = isNewBest
      ? '★ 新記録！'
      : `ベスト: ${formatTime(getBest(mode))} 秒`;

    document.getElementById('start-btn').textContent = 'スタート';
    document.getElementById('start-btn').disabled = false;

    document.getElementById('overlay').classList.add('visible');
    updateHistoryList();
    updateBestDisplay();
  }

  function resetGame() {
    clearInterval(timerInterval);
    running = false;
    finished = false;
    currentIdx = 0;
    errors = 0;
    elapsed = 0;

    document.getElementById('timer-val').textContent = '0.00';
    document.getElementById('errors-val').textContent = '0';
    document.getElementById('next-val').textContent = '—';
    document.getElementById('start-btn').textContent = 'スタート';
    document.getElementById('start-btn').disabled = false;

    buildSequence();
    renderGrid();
    updateBestDisplay();
  }

  function closeOverlay() {
    document.getElementById('overlay').classList.remove('visible');
  }

  // ---- History list ----
  function updateHistoryList() {
    const list = document.getElementById('history-list');
    const history = getHistory();
    list.innerHTML = '';

    if (!history.length) {
      list.innerHTML = '<div style="text-align:center;color:var(--text2);font-size:0.8rem;padding:8px">記録なし</div>';
      return;
    }

    history.forEach((entry, i) => {
      const div = document.createElement('div');
      div.className = 'history-item';
      const d = new Date(entry.date);
      const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      div.innerHTML = `
        <span class="h-rank">${i === 0 ? '🕐' : `#${i+1}`}</span>
        <span class="h-mode">モード ${entry.mode}</span>
        <span class="h-time">${formatTime(entry.time)}秒</span>
        <span class="h-err">ミス ${entry.errors}</span>
        <span style="color:var(--text2);font-size:0.72rem">${dateStr}</span>
      `;
      list.appendChild(div);
    });
  }

  // ---- Init ----
  buildSequence();
  renderGrid();
  updateBestDisplay();
  updateHistoryList();

  // Close overlay on outside click
  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closeOverlay();
  });
</script>
</body>
</html>
